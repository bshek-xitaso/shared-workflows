name: Rust Checks
description: Run configurable checks for an already checked-out and configured Rust project

inputs:
  run-format:
    description: Run cargo fmt
    default: "false"

  run-clippy:
    description: Run cargo clippy
    default: "false"

  clippy-args:
    description: Additional arguments passed to cargo clippy
    default: ""

runs:
  using: composite

  steps:
    - name: Format check
      if: inputs.run-format == 'true'
      shell: bash
      run: |
        rustup component add rustfmt
        cargo fmt --all -- --check -l

    - name: Clippy check
      if: inputs.run-clippy == 'true'
      shell: bash
      env:
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
      run: |
        rustup component add clippy

        read -r -a args <<< "$CLIPPY_ARGS"
        cargo clippy "${args[@]}" -- -D warnings