name: Rust Build Context
description: Compute build metadata and target matrix for an already checked-out Rust project with rustup configured

outputs:
  msrv-version:
    description: Minimum supported Rust version used in the build matrix
    value: ${{ steps.get-versions.outputs.msrv-version }}

  stable-version:
    description: Current stable Rust version used in the build matrix
    value: ${{ steps.get-versions.outputs.stable-version }}

  git-version:
    description: Version label used for generated artifact names
    value: ${{ steps.get-versions.outputs.git-version }}

  ref-name:
    description: Git reference name
    value: ${{ steps.get-versions.outputs.ref-name }}

  targetref:
    description: Git reference argument passed to DevGuard scanners
    value: ${{ steps.get-versions.outputs.targetref }}

  targets:
    description: JSON build target matrix
    value: ${{ steps.get-targets.outputs.targets }}

runs:
  using: composite

  steps:
    # Collect build metadata used for Rust version selection, artifact naming and Git reference arguments passed to DevGuard scanners
    - name: Extract versions
      id: get-versions
      shell: bash
      # Prevent direct interpolation of potentially untrusted Git ref values into the shell script:
      # https://docs.github.com/en/actions/reference/security/secure-use#good-practices-for-mitigating-script-injection-attacks
      env:
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        # Determine the minimum supported and current stable Rust versions used in the build matrix
        MSRV=$(cargo metadata --no-deps --format-version=1 --locked | jq -r '.packages[0].rust_version')
        echo "msrv-version=$MSRV" >> "$GITHUB_OUTPUT"
        STABLE_VERSION=$(rustc +stable --version | awk '{print $2}')
        echo "stable-version=$STABLE_VERSION" >> "$GITHUB_OUTPUT"

        # Determine the version label used for generated artifact names:
        # Use the Git tag for tag builds, a PR-specific label for pull requests and "latest" for other branch builds.
        GIT_VERSION=$(git describe --tags)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          GIT_VERSION="pr-${{ github.event.pull_request.number }}"
        elif [[ "${{ github.ref_type }}" != "tag" ]]; then
          GIT_VERSION="latest"
        fi
        echo "git-version=$GIT_VERSION" >> "$GITHUB_OUTPUT"

        # Export the Git reference name for use by calling workflows
        echo "ref-name=$REF_NAME" >> "$GITHUB_OUTPUT"

        # Select the Git reference argument expected by DevGuard
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          TARGETREF="--ref=$HEAD_REF"
        else
          TARGETREF="--defaultRef=$REF_NAME"
        fi
        echo "targetref=$TARGETREF" >> "$GITHUB_OUTPUT"

    - name: Compute build targets
      id: get-targets # This is a bit hacky, but it allows us to have different targets for PRs and for main/tag builds without having to duplicate the entire matrix strategy
      shell: bash
      run: |
        # Provide all supported targets to the build matrix for non-PR builds
        FULL_TARGETS=$(jq -cn '[
          {"arch": "x86_64-unknown-linux-gnu",  "runs-on": "ubuntu-latest"},
          {"arch": "aarch64-unknown-linux-gnu", "runs-on": "ubuntu-24.04-arm"},
          {"arch": "aarch64-apple-darwin",      "runs-on": "macos-latest"},
          {"arch": "x86_64-apple-darwin",       "runs-on": "macos-latest"},
          {"arch": "x86_64-pc-windows-msvc",    "runs-on": "windows-latest", "ext": ".exe"}
        ]')

        PR_TARGETS=$(jq -cn '[
          {"arch": "x86_64-unknown-linux-gnu", "runs-on": "ubuntu-latest"}
        ]')

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "targets=$PR_TARGETS" >> "$GITHUB_OUTPUT"
        else
          echo "targets=$FULL_TARGETS" >> "$GITHUB_OUTPUT"
        fi